[project]
name = "planmyagents-benchmark"
version = "0.1.0"
description = "Benchmark foundation for PlanMyAgents provider routing."
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]",
  "pyyaml>=6.0",
]

[project.scripts]
planmyagents-bench = "planmyagents_api.cli.bench:main"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"apps/api/tests/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
"scripts/serve_demo.py" = ["E501"]

