# Sprint 3a (S3a-2): hand-authored benchmark cases for the
# Razorpay payment_authorization wrapper.
#
# Razorpay's auth flow differs from Stripe's: the deterministic
# server-side step is Order Create. Test cards apply at the
# customer-facing Checkout payment step (browser-driven, out of
# scope for the v1 wrapper). So the cases here key off the
# ``simulate`` input that the mock honors, and against the real
# Razorpay test API every case will produce ``status="created"``
# for any valid order shape.
#
# Status vocabulary (Razorpay-native, distinct from Stripe):
#   - created   = Order created, awaiting customer payment.
#                 This IS the wrapper-level success state.
#   - attempted = Customer attempted payment but did not finalise.
#   - paid      = Customer payment captured against the order.
# See: https://razorpay.com/docs/api/orders/

cases:
  - id: razorpay-0001-basic-inr-order
    capability: payment_authorization
    difficulty: easy
    created_at: 2026-05-15
    created_by: founder
    inputs:
      amount: 500.0
      currency: INR
      receipt: pma-bench-rzp-0001
    expected:
      status:
        accept: ["created"]
        weight: 0.5
      order_id:
        format_check: "^order_[A-Za-z0-9]{8,}$"
        weight: 0.2
      currency:
        equals: "INR"
        weight: 0.15
      amount_minor:
        equals: 50000
        weight: 0.15
    notes: >
      Smallest happy-path Razorpay case. ₹500 with the receipt
      surfaced verbatim. Wrapper must convert rupees→paise
      (×100) and propagate currency in upper-case (Razorpay's
      contract is uppercase ISO codes, distinct from Stripe).
      order_id must look like a real Razorpay order id (catches
      wrappers that hallucinate ids without hitting the API).

  - id: razorpay-0002-razorpay-minimum-amount
    capability: payment_authorization
    difficulty: easy
    created_at: 2026-05-15
    created_by: founder
    inputs:
      amount: 1.0
      currency: INR
      receipt: pma-bench-rzp-0002
    expected:
      status:
        accept: ["created"]
        weight: 0.6
      amount_minor:
        equals: 100
        weight: 0.4
    notes: >
      Boundary test: Razorpay's documented minimum is ₹1.00
      (100 paise). Catches wrappers that floor sub-rupee amounts
      to zero or apply Stripe's $0.50 minimum reflex.

  - id: razorpay-0003-usd-international-order
    capability: payment_authorization
    difficulty: medium
    created_at: 2026-05-15
    created_by: founder
    inputs:
      amount: 25.00
      currency: USD
      receipt: pma-bench-rzp-0003
    expected:
      status:
        accept: ["created"]
        weight: 0.4
      currency:
        equals: "USD"
        weight: 0.2
      amount_minor:
        equals: 2500
        weight: 0.4
    notes: >
      International-rate path. Razorpay supports USD/EUR/GBP/etc.
      with a 3% international fee (vs 2% INR). The wrapper must
      not silently coerce to INR or round-trip the currency code
      to lowercase (Razorpay rejects lowercase).

  - id: razorpay-0004-receipt-truncation
    capability: payment_authorization
    difficulty: medium
    created_at: 2026-05-15
    created_by: founder
    inputs:
      amount: 100.0
      currency: INR
      receipt: pma-bench-rzp-0004-very-long-receipt-id-that-exceeds-razorpays-limit
    expected:
      status:
        accept: ["created"]
        weight: 0.5
      order_id:
        format_check: "^order_[A-Za-z0-9]{8,}$"
        weight: 0.5
    notes: >
      Razorpay's receipt field is hard-capped at 40 chars; the
      wrapper truncates input to fit. A wrapper that passes the
      full string through gets a 400 BAD_REQUEST_ERROR from
      Razorpay. This case verifies the truncation logic without
      requiring the bench to inspect the receipt itself
      (Razorpay echoes the truncated form back; we don't grade
      on the receipt because the truncation point is an
      implementation detail).

  - id: razorpay-0005-adversarial-status-not-paid
    capability: payment_authorization
    difficulty: adversarial
    created_at: 2026-05-15
    created_by: founder
    inputs:
      amount: 999.0
      currency: INR
      receipt: pma-bench-rzp-0005
      notes:
        workflow_id: bench-adversarial
        attempt: "1"
    expected:
      status:
        accept: ["created"]
        weight: 0.7
      order_id:
        format_check: "^order_[A-Za-z0-9]{8,}$"
        weight: 0.3
    notes: >
      Adversarial: catches wrappers that conflate Order Create
      (the auth step) with Payment Capture (the capture step).
      A correctly-implemented wrapper at the Order Create step
      MUST return ``status="created"`` — not ``status="paid"``.
      A dishonest wrapper that claims ``paid`` for a freshly
      created order (no customer payment yet!) leaks money
      because downstream sub-tasks would treat the order as
      settled and ship the goods. This case grades that
      distinction explicitly: any non-``created`` status fails
      the 0.7-weighted status field, which on its own makes
      the dishonest wrapper score < the honest wrapper.
