services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: planmyagents-postgres
    environment:
      POSTGRES_DB: planmyagents
      POSTGRES_USER: planmyagents
      POSTGRES_PASSWORD: planmyagents
    ports:
      - "55433:5432"
    volumes:
      - planmyagents_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planmyagents -d planmyagents"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  planmyagents_postgres_data:
